- table:
    schema: public
    name: organizations
  object_relationships: []
  array_relationships:
    - name: org_members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: org_members
    - name: workflows
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: workflows
    - name: workflow_runs
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: workflow_runs
    - name: workflow_results
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: workflow_results
    - name: notifications
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: notifications
  select_permissions:
    - role: owner
      permission:
        columns: [id, name, slug, quota_limit, quota_used, quota_period_start, created_at, updated_at]
        filter:
          id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [id, name, slug, quota_limit, quota_used, quota_period_start, created_at, updated_at]
        filter:
          id:
            _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: [id, name, slug, quota_limit, quota_used, quota_period_start, created_at, updated_at]
        filter:
          id:
            _eq: X-Hasura-Org-Id
  update_permissions:
    - role: owner
      permission:
        columns: [name]
        filter:
          id:
            _eq: X-Hasura-Org-Id

- table:
    schema: public
    name: org_members
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships: []
  select_permissions:
    - role: owner
      permission:
        columns: [id, org_id, user_id, role, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [id, org_id, user_id, role, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: [id, org_id, user_id, role, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
  insert_permissions:
    - role: owner
      permission:
        columns: [user_id, role]
        check:
          org_id:
            _eq: X-Hasura-Org-Id
        set:
          org_id: x-hasura-org-id
  update_permissions:
    - role: owner
      permission:
        columns: [role]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
  delete_permissions:
    - role: owner
      permission:
        filter:
          org_id:
            _eq: X-Hasura-Org-Id

- table:
    schema: public
    name: workflows
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships:
    - name: workflow_steps
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_steps
    - name: workflow_triggers
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_triggers
    - name: workflow_runs
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_runs
  select_permissions:
    - role: owner
      permission:
        columns: [id, org_id, name, description, is_active, created_by, created_at, updated_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [id, org_id, name, description, is_active, created_by, created_at, updated_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: [id, org_id, name, description, is_active, created_by, created_at, updated_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
  insert_permissions:
    - role: owner
      permission:
        columns: [name, description, is_active]
        check:
          org_id:
            _eq: X-Hasura-Org-Id
        set:
          org_id: x-hasura-org-id
          created_by: x-hasura-user-id
    - role: editor
      permission:
        columns: [name, description, is_active]
        check:
          org_id:
            _eq: X-Hasura-Org-Id
        set:
          org_id: x-hasura-org-id
          created_by: x-hasura-user-id
  update_permissions:
    - role: owner
      permission:
        columns: [name, description, is_active]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [name, description, is_active]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
  delete_permissions:
    - role: owner
      permission:
        filter:
          org_id:
            _eq: X-Hasura-Org-Id

- table:
    schema: public
    name: workflow_steps
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          column: workflow_step_id
          table:
            schema: public
            name: step_runs
  select_permissions:
    - role: owner
      permission:
        columns: [id, workflow_id, step_order, step_type, config, created_at]
        filter:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [id, workflow_id, step_order, step_type, config, created_at]
        filter:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: [id, workflow_id, step_order, step_type, config, created_at]
        filter:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id
  insert_permissions:
    - role: owner
      permission:
        columns: [workflow_id, step_order, step_type, config]
        check:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [workflow_id, step_order, step_type, config]
        check:
          _and:
            - workflow:
                org_id:
                  _eq: X-Hasura-Org-Id
            - step_type:
                _nin: [db_write, notify]
  update_permissions:
    - role: owner
      permission:
        columns: [step_order, step_type, config]
        filter:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [step_order, config]
        filter:
          _and:
            - workflow:
                org_id:
                  _eq: X-Hasura-Org-Id
            - step_type:
                _nin: [db_write, notify]
  delete_permissions:
    - role: owner
      permission:
        filter:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        filter:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id

- table:
    schema: public
    name: workflow_triggers
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  array_relationships: []
  select_permissions:
    # NOTE: webhook_secret is EXCLUDED from all SELECT column lists
    - role: owner
      permission:
        columns: [id, workflow_id, trigger_type, config, is_active, created_at]
        filter:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [id, workflow_id, trigger_type, config, is_active, created_at]
        filter:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: [id, workflow_id, trigger_type, config, is_active, created_at]
        filter:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id
  insert_permissions:
    - role: owner
      permission:
        columns: [workflow_id, trigger_type, config, is_active]
        check:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [workflow_id, trigger_type, config, is_active]
        check:
          _and:
            - workflow:
                org_id:
                  _eq: X-Hasura-Org-Id
            - trigger_type:
                _nin: [webhook]
  update_permissions:
    - role: owner
      permission:
        columns: [config, is_active]
        filter:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [config, is_active]
        filter:
          _and:
            - workflow:
                org_id:
                  _eq: X-Hasura-Org-Id
            - trigger_type:
                _nin: [webhook]
  delete_permissions:
    - role: owner
      permission:
        filter:
          workflow:
            org_id:
              _eq: X-Hasura-Org-Id

- table:
    schema: public
    name: workflow_runs
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          column: workflow_run_id
          table:
            schema: public
            name: step_runs
  select_permissions:
    - role: owner
      permission:
        columns: [id, workflow_id, org_id, status, trigger_type, triggered_by, context, started_at, completed_at, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [id, workflow_id, org_id, status, trigger_type, triggered_by, context, started_at, completed_at, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: [id, workflow_id, org_id, status, trigger_type, triggered_by, context, started_at, completed_at, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
  # No insert/update/delete for any role — server-side only via admin secret

- table:
    schema: public
    name: step_runs
  object_relationships:
    - name: workflow_run
      using:
        foreign_key_constraint_on: workflow_run_id
    - name: workflow_step
      using:
        foreign_key_constraint_on: workflow_step_id
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships: []
  select_permissions:
    - role: owner
      permission:
        columns: [id, workflow_run_id, workflow_step_id, org_id, step_order, step_type, status, input, output, error, attempt_count, max_attempts, approved_by, approved_at, started_at, completed_at, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [id, workflow_run_id, workflow_step_id, org_id, step_order, step_type, status, input, output, error, attempt_count, max_attempts, approved_by, approved_at, started_at, completed_at, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: [id, workflow_run_id, workflow_step_id, org_id, step_order, step_type, status, input, output, error, attempt_count, max_attempts, approved_by, approved_at, started_at, completed_at, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
  # No insert/update/delete for any role — server-side only via admin secret

- table:
    schema: public
    name: workflow_results
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
    - name: workflow_run
      using:
        foreign_key_constraint_on: workflow_run_id
    - name: step_run
      using:
        foreign_key_constraint_on: step_run_id
  array_relationships: []
  select_permissions:
    - role: owner
      permission:
        columns: [id, org_id, workflow_run_id, step_run_id, result_key, result_value, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [id, org_id, workflow_run_id, step_run_id, result_key, result_value, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: [id, org_id, workflow_run_id, step_run_id, result_key, result_value, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
  event_triggers:
    - name: workflow_results_insert
      definition:
        enable_manual: false
        insert:
          columns: "*"
      retry_conf:
        num_retries: 2
        interval_sec: 30
        timeout_sec: 60
      webhook: "{{EVENT_TRIGGER_URL}}/events/dbEvent"
      headers:
        - name: x-hasura-admin-secret
          value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
      comment: "Fires on workflow_results INSERT to trigger db_event workflows."
  # No insert/update/delete for any role — results written by action handlers via admin secret

- table:
    schema: public
    name: notifications
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships: []
  select_permissions:
    - role: owner
      permission:
        columns: [id, org_id, workflow_run_id, step_run_id, channel, recipient, subject, body, status, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [id, org_id, workflow_run_id, step_run_id, channel, recipient, subject, body, status, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: [id, org_id, channel, recipient, subject, status, created_at]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id

- table:
    schema: public
    name: org_usage_stats
  select_permissions:
    - role: owner
      permission:
        columns: [org_id, org_name, quota_limit, quota_used, runs_this_month, avg_run_duration_seconds]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: [org_id, org_name, quota_limit, quota_used, runs_this_month, avg_run_duration_seconds]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: [org_id, org_name, quota_limit, quota_used, runs_this_month]
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
  event_triggers:
    - name: notification_delivery
      definition:
        enable_manual: false
        insert:
          columns: "*"
      retry_conf:
        num_retries: 3
        interval_sec: 10
        timeout_sec: 30
      webhook: "{{EVENT_TRIGGER_URL}}/events/notificationDelivery"
      headers:
        - name: x-hasura-admin-secret
          value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
      comment: "Fires on notifications INSERT to deliver email/slack/webhook notifications asynchronously."
