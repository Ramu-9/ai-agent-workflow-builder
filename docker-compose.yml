version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  graphql-engine:
    image: hasura/graphql-engine:v2.42.0
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_secret}@postgres:5432/postgres
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-hasura_admin_secret}
      HASURA_GRAPHQL_JWT_SECRET: ${NHOST_JWT_SECRET:-'{"type":"HS256","key":"a_very_long_secret_key_at_least_32_characters_long_for_hs256!!"}'}
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
      HASURA_GRAPHQL_DEV_MODE: 'true'
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      ACTION_BASE_URL: http://functions:3000
      EVENT_TRIGGER_URL: http://functions:3000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    image: nhost/hasura-auth:0.26.0
    restart: unless-stopped
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      graphql-engine:
        condition: service_healthy
    environment:
      AUTH_HOST: '0.0.0.0'
      AUTH_PORT: '4000'
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_secret}@postgres:5432/postgres
      HASURA_GRAPHQL_GRAPHQL_URL: http://graphql-engine:8080/v1/graphql
      HASURA_GRAPHQL_JWT_SECRET: ${NHOST_JWT_SECRET:-'{"type":"HS256","key":"a_very_long_secret_key_at_least_32_characters_long_for_hs256!!"}'}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-hasura_admin_secret}
      AUTH_CLIENT_URL: http://localhost:3001
      AUTH_SMTP_HOST: mailhog
      AUTH_SMTP_PORT: '1025'
      AUTH_SMTP_PASS: password
      AUTH_SMTP_USER: user
      AUTH_SMTP_SENDER: noreply@vocallabs.local
      AUTH_EMAIL_SIGNIN_EMAIL_VERIFIED_REQUIRED: 'false'
      AUTH_ANONYMOUS_USERS_ENABLED: 'false'
      AUTH_DISABLE_NEW_USERS: 'false'
      AUTH_ACCESS_TOKEN_EXPIRES_IN: '900'
      AUTH_REFRESH_TOKEN_EXPIRES_IN: '2592000'
      AUTH_JWT_CUSTOM_CLAIMS: '{"org-id":"metadata.org_id","org-role":"metadata.org_role"}'

  storage:
    image: nhost/hasura-storage:0.6.1
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      graphql-engine:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      BIND: ':5000'
      PUBLIC_URL: http://localhost:5000
      HASURA_METADATA: '1'
      HASURA_ENDPOINT: http://graphql-engine:8080/v1
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-hasura_admin_secret}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioaccess
      S3_SECRET_KEY: miniosecret
      S3_BUCKET: nhost
      S3_REGION: us-east-1
      S3_ROOT_FOLDER: ''
      POSTGRES_MIGRATIONS: '1'
      POSTGRES_MIGRATIONS_SOURCE: postgres://postgres:${POSTGRES_PASSWORD:-postgres_secret}@postgres:5432/postgres?sslmode=disable

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioaccess
      MINIO_ROOT_PASSWORD: miniosecret
    entrypoint: sh
    command: >
      -c 'mkdir -p /data/nhost && minio server /data --console-address ":9001"'
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  functions:
    build:
      context: ./functions
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      graphql-engine:
        condition: service_healthy
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_secret}@postgres:5432/postgres
      HASURA_GRAPHQL_URL: http://graphql-engine:8080/v1/graphql
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-hasura_admin_secret}
      NHOST_JWT_SECRET: ${NHOST_JWT_SECRET:-'{"type":"HS256","key":"a_very_long_secret_key_at_least_32_characters_long_for_hs256!!"}'}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./functions/src:/app/src

volumes:
  pgdata:
  minio_data:
